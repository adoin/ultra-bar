[package]
name = "ultra-bar"
version = "1.0.0"
edition = "2024"

[workspace]
members = [".", "crates/native-ui", "crates/plugin-sdk", "crates/plugin-ui"]
default-members = ["."]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
anyhow = "1"
ultra-bar-native-ui = { path = "crates/native-ui" }
ultra-bar-plugin-sdk = { path = "crates/plugin-sdk" }
notify = "8"
rune = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "=2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows = { version = "=0.58.0", features = ["Win32_Graphics_DirectComposition", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
codegen-units = 4
incremental = true

[profile.release]
debug = 1
