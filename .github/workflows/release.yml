name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ultra-bar
    steps:
      - uses: actions/checkout@v4
        with:
          path: ultra-bar
      - uses: actions/checkout@v4
        with:
          repository: adoin/ultra-bar-plugins
          path: ultra-bar-plugins
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'ultra-bar').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Cargo.toml versions differ' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Check and test
        shell: pwsh
        run: |
          ./dev.ps1 -Task Clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dev.ps1 -Task Test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build release installer
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UltraBar-Windows-Installer
          path: ultra-bar/dist/*
          if-no-files-found: error
      - name: Publish tag release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Ultra Bar $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
